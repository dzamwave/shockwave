# =====================================================================
# Shockwave Configuration File (config.ini)
# Все пользовательские настройки интерфейса, распознавания и звука.
# API-ключи хранятся отдельно в файле .env
# =====================================================================

[Sound]
# Воспроизведение фразы при запуске программы
startup_sound = false

[Interface]
# Горячая клавиша для запуска записи
hotkey = ctrl+space

# Начальное положение виджета на экране:
# bottom-right, bottom-left, top-center
position = bottom-right

# Прозрачность виджета: от 0.10 до 1.00
opacity = 0.85

# Язык консольной панели управления: ru или en
language = ru

[Recognition]
# Основной движок распознавания речи: gigaam или whisper
engine = gigaam

# Модель Whisper: large-v3-turbo, medium, small, base, tiny
whisper_model = large-v3-turbo

# Язык для Whisper: ru, en, auto
whisper_language = ru

# Модель GigaAM
gigaam_model = gigaam-v3-e2e-rnnt

# Квантование GigaAM: int8 (быстрое, 216 МБ) или пусто для float32 (885 МБ)
gigaam_quantization = int8

# Кодовое слово для активации и завершения записи
wake_word = мега

# Максимальная длительность записи в секундах (автостоп для защиты от переполнения буфера ONNX)
max_record_seconds = 180

# Время предупреждения о скором завершении записи (секунды, на виджете замигает красный радар)
warn_record_seconds = 150

[Toggles]
# Начальные состояния чекбоксов на виджете при старте программы
# LLM norm - нормализация пунктуации и терминов через LLM
llm_norm = true

# AI task - превращение надиктованной речи в промпт для AI
ai_task = false

# to EN - перевод надиктованного текста на английский язык
to_en = false

# clip+ - добавление надиктованного текста ПЕРЕД ранее скопированным содержимым буфера
clip_prepend = false

# wake - непрерывное распознавание кодового слова в фоне
wake = true

# alert - звуковые сигналы готовности текста при завершении диктовки
alert_sound = true

[Theme]
# Цветовая палитра плавающего виджета (HEX):
ui_bg_color = #3b274d
ui_grip_color = #2c1c3b

# Цвета консольного терминала:
cli_title_color = #B45FEB
cli_quote_color = #807785

# Отступы текста слева в терминале (число пробелов):
cli_banner_pad = 3
cli_quote_pad = 6
cli_title_pad = 0

[Prompts]
# Пользовательские системные промпты для LLM (оставьте пустыми для использования дефолтных):
# Перевод на английский (to EN):
translate_en = 

# Превращение в промпт для AI (AI task):
ai_task = 

# Превращение в промпт для AI сразу на английском языке (AI task + to EN):
ai_task_en = 
