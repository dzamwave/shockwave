# =====================================================================
# Shockwave — config.example.ini
# Шаблон настроек. Скопируйте этот файл в config.ini.
# Рабочий config.ini в Git не входит.
# endpoint, model и api_key в шаблоне пустые.
# Пустые поля в [LLM] читаются из config/.env.
# =====================================================================

[Recording]
# Как начинается и как долго длится диктовка
hotkey = ctrl+space
max_record_seconds = 180
warn_record_seconds = 150

[Recognition]
# Какую модель использовать: whisper_model или gigaam_model
engine = whisper_model
whisper_model = large-v3-turbo
whisper_language = ru
gigaam_model = gigaam-v3-e2e-rnnt
# int8 — сжатая модель, float32 — полная
gigaam_quantization = float32
# Через сколько секунд простоя выгрузить модель. 0 — не выгружать
model_idle_timeout = 300
onnx_optimize_memory = true

[Wake]
# Кодовое слово: включено ли и какое именно
wake = false
wake_word = шоквейв

[Text]
# Что сделать с текстом после распознавания
llm_norm = true
ai_task = false
to_en = false
idea = false
clip_prepend = false

[LLM]
# Подключение к нейросети. Пустая строка берётся из config/.env
endpoint =
model =
timeout =
api_key =

[Prompts]
# Если строка пустая, текст берётся из config/prompts/*.md
normalization =
translate_en =
ai_task =
ai_task_en =
idea =

[Widget]
# Положение и внешний вид плавающей панели
position = bottom-right
opacity = 0.85
ui_bg_color = #3b274d
ui_grip_color = #2c1c3b

[Sound]
startup_sound = false
alert_sound = true

[Console]
# Язык сообщений в терминале и оформление заставки
language = en
cli_title_color = #B45FEB
cli_quote_color = #807785
cli_banner_pad = 3
cli_quote_pad = 6
cli_title_pad = 0
